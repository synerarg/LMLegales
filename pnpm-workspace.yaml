allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true

# @swc/core llega pinneado exacto por next-intl 4.14.9 (solo para extraccion de mensajes, que este
# proyecto no usa). La 1.16.13 descomprime su binario nativo en %LOCALAPPDATA%\swc y se niega a
# cargar si algun ancestro tiene una ACL con permisos para un SID de AppContainer, como pasa en la
# maquina de desarrollo con Windows. La 1.16.1 carga bien.
overrides:
  '@swc/core': 1.16.1
